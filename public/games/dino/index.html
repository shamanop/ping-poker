<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DINO</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="stage">
  <div id="theme" aria-hidden="true">
    <div class="th-bg">
      <div class="ph">
        <svg class="ph-p" viewBox="0 0 768 1376" preserveAspectRatio="xMidYMax slice"><use href="#bgP"/></svg>
        <svg class="ph-l" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><use href="#bgL"/></svg>
      </div>
      <i class="art a-p"></i><i class="art a-l"></i><i class="art free a-p"></i><i class="art free a-l"></i>
      <i class="th-tint"></i>
    </div>
  </div>
  <header id="top">
    <div class="brand">DINO</div>
    <div id="modebar" hidden><button data-m="play" type="button">Cash</button><button data-m="chips" type="button">Chips</button></div>
    <div class="meter" id="balM"><span class="lbl" id="balLbl">BALANCE</span><b id="bal">0</b></div>
  </header>
  <main id="play">
    <section id="boardCol">
      <div class="th-logo" aria-hidden="true"><svg class="ph" viewBox="0 0 600 300"><use href="#logoSvg"/></svg><i class="art"></i></div>
      <div id="strip">
        <div id="stripL"><span id="hint">8+ SYMBOLS PAY ANYWHERE</span><span id="fsCount" hidden></span></div>
        <div id="stripR"><span id="bonusTot" hidden><i>BONUS</i> <b>0</b></span><span id="multbox" hidden><i>MULTIPLIER</i> <b id="mult">x0</b></span></div>
      </div>
      <div id="boardFrame">
        <div id="board">
          <div class="gridbg"></div>
          <div id="cells"></div>
          <div id="pops"></div>
        </div>
        <div class="th-frame" aria-hidden="true"><svg class="ph" viewBox="0 0 1344 1144"><use href="#frameSvg"/></svg><i class="art"></i></div>
        <div class="th-mascot" aria-hidden="true"><svg class="ph" viewBox="0 0 300 380"><use href="#mascotSvg"/></svg><i class="art p-idle"></i><i class="art p-celebrate"></i><i class="art p-shock"></i><i class="art p-dance"></i></div>
      </div>
      <div id="msg" role="status" aria-live="polite"></div>
    </section>
    <section id="dock">
      <div id="winbox"><span class="lbl">WIN</span><b id="win">0</b></div>
      <div id="ctl">
        <div class="betrow">
          <button class="sq" id="betDn" type="button" aria-label="Lower bet">-</button>
          <div class="meter" id="betM"><span class="lbl">BET</span><b id="bet">0</b><span class="sub" id="cost"></span></div>
          <button class="sq" id="betUp" type="button" aria-label="Raise bet">+</button>
        </div>
        <button id="spin" type="button" aria-label="Spin"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8a16 16 0 1 0 15.2 11" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M33 4l8 14-15-2z" fill="currentColor"/></svg></button>
        <div class="opts">
          <button id="ante" type="button" role="switch" aria-checked="false"><span class="t">ANTE BET</span><span class="s" id="anteSub">x1.25</span></button>
          <button id="buy" type="button"><span class="t">BUY FEATURE</span><span class="s" id="buyPrice">x100</span></button>
        </div>
        <div class="mini">
          <button id="turbo" type="button" aria-pressed="false">Turbo</button>
          <button id="auto" type="button">Auto</button>
          <button id="info" type="button" aria-label="Pay table">Info</button>
          <button id="snd" type="button" aria-label="Sound effects">SFX</button>
          <button id="mus" type="button" aria-label="Music">Music</button>
        </div>
      </div>
      <div class="fine" id="fine"></div>
    </section>
  </main>
  <div id="ov"></div>
</div>
<script src="art.js"></script>
<script src="mascot.js"></script>
<script src="../../money.js"></script>
<script src="timing.js"></script>
<script src="symbols.js"></script>
<script src="fx.js"></script>
<script src="audio.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
