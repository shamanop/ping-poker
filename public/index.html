<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Bitter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=1-ui1">
  <link rel="stylesheet" href="style.css?v=26-ui1">
  <link rel="stylesheet" href="bank.css?v=8-ui1">
  <link rel="stylesheet" href="admin.css?v=5-ui1">
  <link rel="stylesheet" href="shell.css?v=2-ui1">
  <link rel="stylesheet" href="lobby.css?v=6-port">
  <link rel="stylesheet" href="amount.css?v=2-ui1">
  <link rel="stylesheet" href="juice.css?v=4-ui1">
  <link rel="stylesheet" href="looks.css?v=2-ui1">
  <link rel="stylesheet" href="music.css?v=2-port">
  <link rel="stylesheet" href="recap.css?v=1-port">
  <link rel="stylesheet" href="phone.css?v=2-ui1" media="(max-width: 600px)">
  <link rel="stylesheet" href="landscape.css?v=1-ui1" media="(max-height: 500px) and (min-width: 601px)">
</head>
<body>

  <!-- shared SVG sprite: suits + icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="s-spade" viewBox="0 0 100 100"><path fill="currentColor" d="M50 3C50 3 7 37 7 62c0 15 11 25 24 25 7 0 13-3 16-8-1 10-5 16-13 19h32c-8-3-12-9-13-19 3 5 9 8 16 8 13 0 24-10 24-25C93 37 50 3 50 3Z"/></symbol>
      <symbol id="s-heart" viewBox="0 0 100 100"><path fill="currentColor" d="M50 95C50 95 5 63 5 32 5 16 17 7 30 7c9 0 17 5 20 14 3-9 11-14 20-14 13 0 25 9 25 25 0 31-45 63-45 63Z"/></symbol>
      <symbol id="s-diamond" viewBox="0 0 100 100"><path fill="currentColor" d="M50 3C60 22 76 38 91 50 76 62 60 78 50 97 40 78 24 62 9 50 24 38 40 22 50 3Z"/></symbol>
      <symbol id="s-club" viewBox="0 0 100 100"><g fill="currentColor"><circle cx="50" cy="27" r="22"/><circle cx="25" cy="63" r="22"/><circle cx="75" cy="63" r="22"/><path d="M50 52c0 24-5 37-16 46h32C55 89 50 76 50 52Z"/></g></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path fill="currentColor" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8Z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M9 9h10v11H9zM5 15V4h10"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></symbol>
    </defs>
  </svg>

  <!-- ── SHELL + LOBBY MOUNTS ───────────────────────────────────── -->
  <div id="shell-root"></div>
  <div id="lobby-root" class="lb-root"></div>

  <!-- ── GAME ───────────────────────────────────────────────────── -->
  <div id="game-screen" class="screen">
    <div class="g-grid">

      <header class="g-head">
        <div class="hd-left">
          <span id="bank-slot"></span>
          <span id="host-slot"></span>
          <button type="button" class="btn btn--secondary btn--sm" id="btn-sit-out" title="Sit out from the next hand">Sit out</button>
          <button type="button" class="btn btn--secondary btn--sm rail-toggle" id="btn-rail-toggle" aria-controls="rail" aria-expanded="false">Chat</button>
          <button type="button" class="btn btn--danger btn--sm" id="btn-leave-table" title="Stand up and take your stack back to your bank">Leave table</button>
        </div>
        <div class="hd-mid">
          <div class="pl" id="pl-level-wrap"><label>Level</label><b id="pl-level">1</b></div>
          <div class="pl" id="pl-next-wrap"><label>Next level</label><b id="pl-next">&mdash;</b></div>
          <div class="pl"><label>Street</label><b id="pl-street">&mdash;</b></div>
        </div>
        <div class="hd-right">
          <button type="button" class="room-chip btn btn--secondary btn--sm" id="room-code-btn" title="Copy invite link">
            <span>Room</span><b id="room-code">&mdash;</b>
            <svg class="ico"><use href="#i-copy"/></svg>
            <span class="copy-flash">Copied</span>
          </button>
          <button type="button" id="sound-toggle" class="btn btn--icon btn--secondary btn--sm" title="Toggle sound" aria-label="Toggle sound"><svg class="ico"><use href="#i-sound"/></svg></button>
          <button type="button" class="g-brand" id="btn-home" title="Back to home" aria-label="Leave table"><img class="lockup-vp" src="/images/vp-logo.png" alt=""></button>
          <div class="blinds-plate plate"><label class="plate__label">Blinds</label><b class="plate__value" id="pl-blinds">10 / 20</b></div>
        </div>
      </header>

      <aside class="g-rail panel panel--tight" id="rail">
        <div class="rail-sec rail-chat">
          <div class="rail-h panel__title panel__title--bar">Chat<button type="button" class="rail-flip btn btn--icon btn--ghost btn--sm" id="btn-panel-side" aria-label="Move panel to the right"></button></div>
          <div id="chat-messages" class="chat-messages"></div>
        </div>
        <div class="rail-sec">
          <div class="rail-h panel__title panel__title--bar">Stickers</div>
          <div class="sticker-grid" id="sticker-grid">
            <button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🔥">🔥</button><button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="💎">💎</button>
            <button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🤑">🤑</button><button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="💀">💀</button>
            <button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🍀">🍀</button><button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="👑">👑</button>
            <button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🎰">🎰</button><button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🎯">🎯</button>
            <button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🃏">🃏</button><button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🎲">🎲</button>
            <button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="🏆">🏆</button><button type="button" class="sticker-item btn btn--icon btn--secondary" data-emoji="😤">😤</button>
          </div>
        </div>
        <div class="rail-sec">
          <div class="rail-h panel__title panel__title--bar">Throws</div>
          <div class="throw-grid" id="throw-grid">
            <button type="button" class="throw-item btn btn--icon btn--secondary" data-item="💣" title="Bomb">💣</button><button type="button" class="throw-item btn btn--icon btn--secondary" data-item="🍅" title="Tomato">🍅</button>
            <button type="button" class="throw-item btn btn--icon btn--secondary" data-item="💦" title="Splash">💦</button><button type="button" class="throw-item btn btn--icon btn--secondary" data-item="🎉" title="Popper">🎉</button>
          </div>
          <div class="throw-hint" id="throw-hint">Pick one, then click a player</div>
        </div>
        <div class="chat-input-row">
          <input type="text" class="chat-input field field--sm" id="chat-input" placeholder="Type your message..." maxlength="120" autocomplete="off">
          <button type="button" class="chat-send btn btn--icon btn--ghost btn--sm" id="chat-send" aria-label="Send message">&#x21B5;</button>
        </div>
        <div id="log-entries" class="log-entries" hidden></div>
        <div id="leaderboard-entries" hidden></div>
      </aside>

      <main class="g-stage" id="stage">
        <div class="stage-backdrop"></div>
          <div class="emote-strip" id="emote-strip" role="group" aria-label="Quick emotes"><button type="button" class="emote-btn btn btn--icon btn--secondary" data-emote="thumbs" aria-label="Thumbs up (key 1)" title="Thumbs up [1]"><img alt="" src="images/fx2/sticker-emote-thumbs.png"><kbd>1</kbd></button><button type="button" class="emote-btn btn btn--icon btn--secondary" data-emote="laugh" aria-label="Laugh (key 2)" title="Laugh [2]"><img alt="" src="images/fx2/sticker-emote-laugh.png"><kbd>2</kbd></button><button type="button" class="emote-btn btn btn--icon btn--secondary" data-emote="mindblown" aria-label="Mind blown (key 3)" title="Mind blown [3]"><img alt="" src="images/fx2/sticker-emote-mindblown.png"><kbd>3</kbd></button><button type="button" class="emote-btn btn btn--icon btn--secondary" data-emote="sweat" aria-label="Sweat (key 4)" title="Sweat [4]"><img alt="" src="images/fx2/sticker-emote-sweat.png"><kbd>4</kbd></button><button type="button" class="emote-btn btn btn--icon btn--secondary" data-emote="clap" aria-label="Clap (key 5)" title="Clap [5]"><img alt="" src="images/fx2/sticker-emote-clap.png"><kbd>5</kbd></button><button type="button" class="emote-btn btn btn--icon btn--secondary" data-emote="tilt" aria-label="Tilt (key 6)" title="Tilt [6]"><img alt="" src="images/fx2/sticker-emote-tilt.png"><kbd>6</kbd></button></div>
        <div id="table-box" class="table-box">
          <img id="table-mark" class="table-mark" src="images/ui/vp-mark.png" alt="">
          <div class="t-center" id="t-center">
            <div id="pot-row" class="pot-row"></div>
            <div id="community-cards" class="community"></div>
          </div>
          <div id="hero-cards-wrap" class="hero-cards-wrap">
            <div id="my-hand-label" class="hero-label"></div>
            <div id="hole-cards" class="hero-cards"></div>
          </div>
          <div class="t-lamp" id="t-lamp"></div>
        </div>
        <div id="bust-panel" class="bust-panel panel panel--warn hidden">
          <div class="bust-title">Out of chips</div>
          <div id="bust-balance" class="bust-balance">Bank 0</div>
          <div id="bust-amt" class="bust-amt"></div>
          <div class="bust-actions">
            <button id="btn-rebuy" class="btn btn--primary">Rebuy 1,500</button>
            <button id="btn-spectate" class="btn btn--secondary btn--sm">Spectate</button>
            <button id="btn-leave" class="btn btn--danger btn--sm">Leave</button>
          </div>
          <div id="bust-broke-msg" class="bust-broke hidden">Your bank is empty. GG.</div>
        </div>
        <div id="wait-panel" class="wait-panel panel hidden">
          <div class="wp-msg" id="wp-msg"><span class="pulse-dot"></span><span id="wp-text">Waiting for a second player</span></div>
          <div class="wp-sub" id="wp-sub">Deals automatically when a second player sits down.</div>
          <div class="wp-seats" id="wp-seats"></div>
          <button type="button" class="wp-invite btn btn--secondary btn--block btn--wrap" id="wp-invite" title="Copy invite link">
            <span class="wp-invite-label">Invite a friend</span>
            <span class="wp-invite-link" id="wp-invite-link"></span>
            <span class="wp-invite-cta">Copy link</span>
          </button>
          <button id="btn-start" class="btn btn--primary btn--block hidden">Start game</button>
        </div>
        <div id="show-panel" class="show-panel panel panel--tight hidden">
          <span class="sp-label">Show your cards</span>
          <button type="button" class="btn btn--secondary btn--sm" data-w="0">Show left</button>
          <button type="button" class="btn btn--secondary btn--sm" data-w="both">Show both</button>
          <button type="button" class="btn btn--secondary btn--sm" data-w="1">Show right</button>
        </div>
        <div id="bet-layer" class="bet-layer"></div>
        <div id="puck-layer" class="puck-layer"></div>
        <div id="player-seats" class="seat-layer"></div>
        <div id="showdown-overlay" class="showdown-overlay panel panel--tight hidden">
          <div id="showdown-content"></div>
          <div class="sd-foot"><span class="showdown-timer">Next hand in <span id="countdown">5</span>s</span><span class="sd-bar"><i id="showdown-bar"></i></span></div>
        </div>
      </main>

      <footer class="g-bar" id="action-bar">
        <div class="bar-help" id="bar-status" data-mode="idle">
          <div class="turn-ring" id="turn-ring">
            <svg viewBox="0 0 40 40"><circle class="trk" cx="20" cy="20" r="17" pathLength="100"/><circle class="val" id="my-turn-ring" cx="20" cy="20" r="17" pathLength="100"/></svg>
            <span id="my-turn-timer">&nbsp;</span>
          </div>
          <b id="bar-status-main">Waiting</b>
          <span id="bar-status-sub"></span>
        </div>

        <div class="bar-acts" id="bar-acts">
          <button id="btn-fold" class="act act-fold" disabled><span class="act-main">Fold</span><span class="act-sub">&nbsp;</span></button>
          <button id="btn-check-call" class="act act-call" disabled><span class="act-main">Check</span><span class="act-sub">&nbsp;</span></button>
          <button id="btn-raise" class="act act-raise" disabled><span class="act-main">Raise</span><span class="act-sub" id="raise-sub">&nbsp;</span></button>
        </div>
        <div class="bar-pre hidden" id="bar-pre">
          <button type="button" class="act act-pre" id="pre-checkfold" aria-pressed="false"><span class="act-main">Check/Fold</span><span class="act-sub">&nbsp;</span></button>
          <button type="button" class="act act-pre" id="pre-call" aria-pressed="false"><span class="act-main">Call</span><span class="act-sub" id="pre-call-sub">&nbsp;</span></button>
        </div>

        <div class="raise-box" id="raise-box"><div id="raise-mount" class="raise-mount"></div></div>
      </footer>
    </div>

    <div id="toasts" class="toasts"></div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="uiguard.js?v=1-v2"></script>
  <script src="money.js?v=2-v2"></script>
  <script src="amount.js?v=1-v2"></script>
  <script src="sound.js?v=1-1006"></script>
  <script src="juice.js?v=2-1006"></script>
  <script src="sounds-juice.js?v=3-port"></script>
  <script src="looks.js?v=1-looks"></script>
  <script src="game.js?v=26-v2"></script>
  <script src="bank.js?v=10-v2"></script>
  <script src="admin.js?v=7-v2"></script>
  <script src="shell.js?v=2-1006"></script>
  <script src="lobby.js?v=8-port"></script>
  <script src="music-clock.js?v=1-port"></script>
  <script src="music.js?v=2-port"></script>
  <script src="recap.js?v=1-port"></script>
</body>
</html>
